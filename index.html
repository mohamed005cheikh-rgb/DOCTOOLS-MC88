<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DOCTOOLS – Core PDF & Document Suite</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236c5ce7'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial' font-weight='900' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --primary: #6c5ce7; --primary-dark: #5a4bd1; --primary-light: #a29bfe;
            --secondary: #00cec9; --red: #e17055; --green: #00b894;
            --dark: #1a1a2e; --bg: #f0f2f5; --card-bg: #ffffff; --text: #2d3436; --text-light: #636e72;
            --shadow: 0 10px 40px rgba(0,0,0,0.08); --radius: 16px; --radius-sm: 10px;
            --transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            --header-bg: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 50%, #3d3d5c 100%); --header-text: #ffffff;
        }
        [data-theme="dark"] { --bg: #0f0f1a; --card-bg: #1e1e2f; --text: #e0e0e0; --text-light: #a0a0b0; --shadow: 0 10px 40px rgba(0,0,0,0.5); --header-bg: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 40%, #2d2d44 100%); }
        [data-theme="glass"] { --bg: #e0e5ec; --card-bg: rgba(255,255,255,0.75); --text: #1e1e2e; --text-light: #4a4a5e; --shadow: 0 8px 32px rgba(31,38,135,0.12); --header-bg: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0.2)); --header-text: #1e1e2e; }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body { height:100%; }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); overflow-x:hidden; transition:background .4s ease,color .4s ease; }
        h1,h2,h3,h4 { font-family:'Poppins',sans-serif; }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-thumb { background:var(--primary-light); border-radius:4px; }

        #particles-canvas { position:fixed; top:0; left:0; right:0; bottom:0; z-index:0; pointer-events:none; opacity:.3; }
        #dragOverlay { position:fixed; inset:0; background:rgba(108,92,231,.15); backdrop-filter:blur(4px); z-index:999; display:none; align-items:center; justify-content:center; font-size:1.3rem; font-weight:700; color:var(--primary); pointer-events:none; border:4px dashed var(--primary); margin:16px; border-radius:24px; text-align:center; padding:20px; }
        #dragOverlay.show { display:flex; }

        /* ===== HOME SCREEN ===== */
        .home-header { background:var(--header-bg); color:var(--header-text); padding:20px 16px 74px; position:relative; overflow:hidden; z-index:2; transition:background .4s ease; }
        .home-header::before { content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:radial-gradient(circle at 30% 50%, rgba(108,92,231,.22), transparent 50%), radial-gradient(circle at 70% 70%, rgba(0,206,201,.16), transparent 50%); animation:headerGlow 10s ease-in-out infinite alternate; }
        @keyframes headerGlow { 0%{transform:translate(0,0) rotate(0deg);} 100%{transform:translate(2%,3%) rotate(5deg);} }
        .home-header-top { position:relative; z-index:3; display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
        .brand { display:flex; align-items:center; gap:10px; }
        .brand .logo-icon { font-size:1.5rem; }
        .brand h1 { font-size:1.4rem; font-weight:900; letter-spacing:.5px; background:linear-gradient(135deg,#fff,#a29bfe); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .home-header-actions { display:flex; gap:8px; }
        .icon-pill { background:rgba(255,255,255,.15); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.28); border-radius:50%; width:38px; height:38px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:var(--transition); color:inherit; font-size:1rem; }
        .icon-pill:active { transform:scale(.9); background:rgba(255,255,255,.28); }
        .home-header-sub { position:relative; z-index:3; font-size:.85rem; opacity:.8; margin-bottom:16px; max-width:480px; }

        .search-wrap { position:relative; z-index:3; }
        .search-input { width:100%; padding:13px 16px 13px 42px; border-radius:16px; border:none; font-size:.95rem; font-family:'Inter',sans-serif; background:rgba(255,255,255,.14); color:#fff; outline:none; backdrop-filter:blur(10px); }
        .search-input::placeholder { color:rgba(255,255,255,.6); }
        .search-wrap i { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,.6); font-size:.95rem; }
        [data-theme="glass"] .search-input { color:#1e1e2e; } [data-theme="glass"] .search-input::placeholder { color:rgba(30,30,46,.5); } [data-theme="glass"] .search-wrap i { color:rgba(30,30,46,.5); }

        .chips-container { max-width:1100px; margin:-42px auto 18px; padding:0 16px; position:relative; z-index:5; }
        .chips-row { display:flex; gap:8px; overflow-x:auto; padding:10px; background:var(--card-bg); border-radius:50px; box-shadow:var(--shadow); scrollbar-width:none; }
        .chips-row::-webkit-scrollbar { display:none; }
        .chip-btn { flex:0 0 auto; padding:9px 16px; border-radius:40px; border:none; cursor:pointer; font-family:'Poppins',sans-serif; font-weight:600; font-size:.82rem; transition:var(--transition); background:transparent; color:var(--text-light); white-space:nowrap; }
        .chip-btn.active { background:var(--primary); color:#fff; box-shadow:0 6px 18px rgba(108,92,231,.32); }

        .home-content { max-width:1100px; margin:0 auto 30px; padding:0 16px; position:relative; z-index:3; }
        .recent-files-bar { display:flex; flex-wrap:wrap; gap:8px; padding:10px 14px; background:var(--card-bg); border-radius:var(--radius-sm); margin-bottom:14px; align-items:center; box-shadow:var(--shadow); }
        .recent-files-bar .label { font-weight:700; font-size:.75rem; color:var(--text-light); margin-right:4px; }
        .recent-item { background:var(--bg); padding:5px 12px; border-radius:20px; font-size:.72rem; cursor:pointer; color:var(--text); max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

        .no-results { text-align:center; padding:40px 20px; color:var(--text-light); font-size:.9rem; }

        /* ===== TOOLS LIST (unique row layout, not a modal-grid) ===== */
        .tools-list { display:flex; flex-direction:column; gap:10px; }
        .tool-row { display:flex; align-items:center; gap:14px; background:var(--card-bg); border-radius:18px; padding:13px 15px; box-shadow:var(--shadow); cursor:pointer; transition:var(--transition); border:1px solid transparent; --tool-color:var(--primary); }
        .tool-row:active { transform:scale(.98); border-color:var(--tool-color); }
        .tool-row .icon-wrapper { width:46px; height:46px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff; background:var(--tool-color); box-shadow:0 6px 16px rgba(0,0,0,.1); }
        .tool-row .tool-text { flex:1; min-width:0; }
        .tool-row h3 { font-size:.98rem; font-weight:700; margin-bottom:2px; }
        .tool-row p { font-size:.78rem; color:var(--text-light); font-weight:500; line-height:1.4; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
        .tool-row .chev { color:var(--text-light); opacity:.4; font-size:.9rem; flex-shrink:0; }
        .tool-badge-sm { font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--tool-color); background:color-mix(in srgb, var(--tool-color) 12%, transparent); padding:2px 8px; border-radius:10px; display:inline-block; margin-top:4px; }

        @media (min-width:720px) {
            .tools-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); }
        }

        .footer { text-align:center; padding:26px 20px; background:var(--header-bg); color:var(--header-text); font-size:.82rem; }
        .footer .copyright { margin-top:6px; opacity:.75; font-size:.78rem; }

        /* ===== TOOL SCREEN (full-screen workspace — fixes mobile cramping) ===== */
        .tool-screen { position:fixed; inset:0; height:100dvh; background:var(--bg); z-index:100; display:none; flex-direction:column; }
        .tool-screen.active { display:flex; }
        .tool-topbar { flex-shrink:0; display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 12px 10px; background:var(--card-bg); box-shadow:0 4px 16px rgba(0,0,0,.06); z-index:3; }
        .tool-back-btn { width:38px; height:38px; border-radius:50%; border:none; background:rgba(0,0,0,.06); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1rem; cursor:pointer; flex-shrink:0; }
        .tool-back-btn:active { transform:scale(.9); }
        .tool-icon-mini { width:34px; height:34px; border-radius:10px; background:var(--tool-color); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
        .tool-title-wrap { flex:1; min-width:0; }
        .tool-title-wrap h2 { font-size:.98rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .tool-title-wrap .tool-when { font-size:.68rem; color:var(--text-light); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
        .tool-guide-btn { width:38px; height:38px; border-radius:50%; border:none; background:color-mix(in srgb, var(--tool-color) 12%, transparent); color:var(--tool-color); display:flex; align-items:center; justify-content:center; font-size:1rem; cursor:pointer; flex-shrink:0; }
        .tool-guide-btn:active { transform:scale(.9); }

        .tool-guide-drawer { display:none; background:color-mix(in srgb, var(--tool-color) 7%, var(--card-bg)); border-bottom:1px solid color-mix(in srgb, var(--tool-color) 18%, transparent); padding:14px 16px; font-size:.85rem; line-height:1.65; flex-shrink:0; max-height:40dvh; overflow-y:auto; }
        .tool-guide-drawer.open { display:block; animation:fadeIn .2s ease; }
        @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
        .tool-guide-drawer .g-label { font-weight:700; font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; color:var(--tool-color); margin-bottom:4px; }
        .tool-guide-drawer ol { padding-left:18px; margin:2px 0 10px; }
        .tool-guide-drawer li { margin-bottom:3px; }
        .tool-guide-drawer .guide-tip { font-size:.8rem; color:var(--text-light); font-style:italic; display:flex; gap:6px; align-items:flex-start; }

        .tool-body { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px; display:flex; flex-direction:column; gap:12px; }
        .tool-body > * { flex-shrink:0; }
        .canvas-fill { flex:1 1 auto; min-height:220px; display:flex; align-items:center; justify-content:center; overflow:hidden; background:rgba(0,0,0,.04); border-radius:16px; touch-action:none; }
        .canvas-fill canvas { touch-action:none; display:block; border-radius:8px; box-shadow:0 4px 18px rgba(0,0,0,.18); background:#fff; }

        .tool-actionbar { flex-shrink:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--card-bg); box-shadow:0 -6px 20px rgba(0,0,0,.08); z-index:3; }

        /* ===== UPLOAD AREA ===== */
        .upload-area { border:2px dashed #ccc; border-radius:var(--radius-sm); padding:22px 16px; text-align:center; cursor:pointer; transition:var(--transition); background:rgba(0,0,0,.03); color:var(--text); }
        .upload-area:active { background:rgba(0,0,0,.06); }
        .upload-area.dragover { border-color:var(--tool-color); background:rgba(0,0,0,.08); }
        .upload-area i { font-size:30px; color:#bbb; margin-bottom:8px; }
        .upload-area p { font-weight:600; font-size:.88rem; }
        .upload-area .sub-text { font-size:.75rem; color:#999; margin-top:3px; font-weight:500; }

        /* ===== BUTTONS ===== */
        .btn { display:flex; align-items:center; justify-content:center; gap:8px; padding:14px 22px; border-radius:16px; font-size:1rem; font-weight:700; font-family:'Poppins',sans-serif; border:none; cursor:pointer; transition:var(--transition); width:100%; min-height:50px; }
        .btn-primary { background:var(--tool-color); color:#fff; box-shadow:0 6px 20px rgba(0,0,0,.18); }
        .btn-primary:active { transform:scale(.97); }
        .btn-primary:disabled { opacity:.45; cursor:not-allowed; transform:none; }
        .btn-secondary { background:rgba(0,0,0,.08); color:var(--text); }
        .btn-sm { padding:9px 16px; font-size:.82rem; width:auto; min-height:38px; }

        /* ===== FORM ===== */
        .form-group { }
        .form-group label { display:block; font-weight:600; font-size:.86rem; margin-bottom:6px; color:var(--text); }
        .form-group .tooltip { font-weight:400; font-size:.72rem; color:var(--text-light); opacity:.75; margin-left:4px; }
        .form-group input[type="text"], .form-group input[type="number"], .form-group select, .form-group textarea {
            width:100%; padding:12px 14px; border:2px solid rgba(0,0,0,.1); border-radius:var(--radius-sm); font-size:.95rem; font-family:'Inter',sans-serif; background:var(--card-bg); color:var(--text); outline:none;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--tool-color); }
        .form-group textarea { min-height:110px; resize:vertical; }

        /* ===== PROGRESS / PREVIEW / FILE INFO ===== */
        .progress-bar { width:100%; height:7px; background:rgba(0,0,0,.1); border-radius:4px; overflow:hidden; margin-bottom:10px; display:none; }
        .progress-bar.active { display:block; }
        .progress-bar .fill { height:100%; background:var(--tool-color); width:0%; transition:width .3s ease; }
        .loading-spinner { display:inline-block; width:16px; height:16px; border:3px solid rgba(255,255,255,.3); border-radius:50%; border-top-color:#fff; animation:spin .8s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg);} }
        .preview-container { padding:12px; background:rgba(0,0,0,.03); border-radius:var(--radius-sm); text-align:center; }
        .preview-container img { max-width:100%; max-height:170px; border-radius:8px; }
        .preview-grid { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
        .preview-grid .thumb { width:64px; height:80px; object-fit:cover; border-radius:6px; }
        .file-info { display:flex; align-items:center; gap:10px; padding:11px 14px; background:rgba(0,0,0,.05); border-radius:var(--radius-sm); font-weight:500; font-size:.85rem; flex-wrap:wrap; }
        .file-info i { color:var(--tool-color); }
        .file-size-warning { color:var(--red); font-weight:700; margin-left:auto; font-size:.78rem; }

        /* ===== PAGE ORGANIZER (bigger touch targets) ===== */
        .page-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:10px; }
        .page-thumb { position:relative; background:var(--card-bg); border-radius:12px; padding:6px; box-shadow:0 2px 10px rgba(0,0,0,.1); }
        .page-thumb img { width:100%; border-radius:8px; display:block; }
        .page-thumb .pn-badge { position:absolute; top:6px; left:10px; background:rgba(0,0,0,.65); color:#fff; border-radius:10px; padding:1px 8px; font-size:.68rem; }
        .page-thumb .pn-actions { display:flex; justify-content:center; gap:5px; margin-top:6px; }
        .page-thumb .pn-actions button { flex:1; min-height:34px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-size:.85rem; cursor:pointer; }
        .page-thumb .pn-actions button.pn-del { background:var(--red); }

        /* ===== REDACT TOOLBAR ===== */
        .redact-toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        .redact-toolbar button { padding:9px 14px; min-height:38px; border-radius:20px; border:none; font-weight:600; font-size:.8rem; cursor:pointer; background:rgba(0,0,0,.08); color:var(--text); }
        .redact-toolbar .page-indicator { font-size:.8rem; font-weight:700; color:var(--text-light); margin-left:auto; }

        /* ===== TOAST ===== */
        .toast { position:fixed; bottom:calc(20px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(80px); background:var(--dark); color:#fff; padding:13px 22px; border-radius:50px; font-weight:600; font-size:.9rem; z-index:2000; opacity:0; transition:all .35s cubic-bezier(.4,0,.2,1); box-shadow:0 10px 30px rgba(0,0,0,.35); display:flex; align-items:center; gap:8px; pointer-events:none; max-width:88vw; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .toast .success { color:#00b894; } .toast .error { color:#e17055; }

        /* ===== QUICKSTART MODAL (small, not a workspace — fine as a centered sheet) ===== */
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(6px); z-index:1000; display:none; align-items:flex-end; justify-content:center; }
        .modal-overlay.active { display:flex; }
        .modal { background:var(--card-bg); border-radius:22px 22px 0 0; width:100%; max-width:520px; max-height:85dvh; overflow-y:auto; padding:24px 20px calc(24px + env(safe-area-inset-bottom)); position:relative; color:var(--text); }
        @media (min-width:560px) { .modal-overlay{align-items:center;} .modal{border-radius:22px; margin:20px;} }
        .modal-close { position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%; border:none; background:rgba(0,0,0,.08); cursor:pointer; color:var(--text-light); display:flex; align-items:center; justify-content:center; }
        .modal-header { text-align:center; margin-bottom:18px; }
        .modal-header .modal-icon { width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; font-size:24px; color:#fff; background:var(--primary); }
        .modal-header h2 { font-size:1.3rem; font-weight:700; }
        .modal-header p { font-size:.85rem; color:var(--text-light); margin-top:4px; }
        .qs-step { display:flex; gap:12px; margin-bottom:14px; align-items:flex-start; }
        .qs-num { flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.8rem; }
        .qs-step p { font-size:.85rem; color:var(--text-light); line-height:1.5; }
        .qs-step strong { color:var(--text); }
    </style>
</head>
<body>

    <div id="dragOverlay"><i class="fas fa-file-upload" style="margin-right:12px;"></i> Drop your file here</div>
    <canvas id="particles-canvas"></canvas>

    <!-- ===== HOME SCREEN ===== -->
    <div id="homeScreen">
        <header class="home-header">
            <div class="home-header-top">
                <div class="brand"><span class="logo-icon"><i class="fas fa-file-pdf"></i></span><h1>DOCTOOLS</h1></div>
                <div class="home-header-actions">
                    <button class="icon-pill" id="helpToggle" title="How this works"><i class="fas fa-circle-question"></i></button>
                    <button class="icon-pill" id="themeToggle" title="Theme"><i class="fas fa-moon"></i></button>
                </div>
            </div>
            <p class="home-header-sub">16 free PDF & document tools · 100% on-device · nothing is ever uploaded</p>
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Search tools — e.g. 'compress', 'sign', 'merge'…">
            </div>
        </header>

        <div class="chips-container">
            <div class="chips-row" id="chipsRow">
                <button class="chip-btn active" data-category="all">All</button>
                <button class="chip-btn" data-category="conversion">Conversion</button>
                <button class="chip-btn" data-category="optimization">Optimization</button>
                <button class="chip-btn" data-category="security">Security</button>
                <button class="chip-btn" data-category="organize">Organize</button>
                <button class="chip-btn" data-category="data">Data</button>
                <button class="chip-btn" data-category="media">Media</button>
            </div>
        </div>

        <div class="home-content">
            <div id="recentFilesBar" class="recent-files-bar" style="display:none;">
                <span class="label"><i class="fas fa-clock"></i> Recent:</span>
                <div id="recentFilesList" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
            </div>
            <div class="tools-list" id="toolsList"></div>
            <div class="no-results" id="noResults" style="display:none;"><i class="fas fa-magnifying-glass" style="font-size:1.6rem; opacity:.4; display:block; margin-bottom:10px;"></i>No tools match your search.</div>
        </div>

        <footer class="footer">
            <p>© 2026 <strong>DOCTOOLS</strong> — All rights reserved.</p>
            <p class="copyright">mohamed005cheikh@gmail.com | by MC88</p>
        </footer>
    </div>

    <!-- ===== TOOL SCREEN (full-screen workspace) ===== -->
    <div class="tool-screen" id="toolScreen" style="--tool-color:var(--primary);">
        <div class="tool-topbar">
            <button class="tool-back-btn" id="toolBackBtn"><i class="fas fa-arrow-left"></i></button>
            <div class="tool-icon-mini" id="toolIconMini"><i class="fas fa-cog"></i></div>
            <div class="tool-title-wrap">
                <h2 id="toolTitle">Tool</h2>
                <p class="tool-when" id="toolWhen">When to use it…</p>
            </div>
            <button class="tool-guide-btn" id="toolGuideBtn"><i class="fas fa-circle-question"></i></button>
        </div>
        <div class="tool-guide-drawer" id="toolGuideDrawer"></div>
        <div class="tool-body" id="toolBody"></div>
        <div class="tool-actionbar" id="toolActionBar"></div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle success" id="toastIcon"></i>
        <span id="toastMessage">Done!</span>
    </div>

    <input type="file" id="fileInput" style="display:none;" accept="*/*" multiple />

    <script>
        // ============================================================
        // THEME
        // ============================================================
        (function() {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (prefersDark) document.documentElement.setAttribute('data-theme', 'dark');
        })();
        const themeToggle = document.getElementById('themeToggle');
        let currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            currentTheme = theme;
            const icon = themeToggle.querySelector('i');
            icon.className = theme === 'dark' ? 'fas fa-sun' : theme === 'glass' ? 'fas fa-adjust' : 'fas fa-moon';
        }
        setTheme(currentTheme);
        themeToggle.addEventListener('click', () => {
            if (currentTheme === 'light') setTheme('dark');
            else if (currentTheme === 'dark') setTheme('glass');
            else setTheme('light');
        });

        // ============================================================
        // PARTICLES BACKGROUND
        // ============================================================
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [], mouse = { x: 0, y: 0 };
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        class Particle {
            constructor() { this.reset(); }
            reset() { this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.size=Math.random()*2+0.5; this.speedX=(Math.random()-0.5)*0.4; this.speedY=(Math.random()-0.5)*0.4; this.opacity=Math.random()*0.4+0.1; }
            update() { this.x+=this.speedX+(mouse.x-canvas.width/2)*0.001; this.y+=this.speedY+(mouse.y-canvas.height/2)*0.001; if(this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height) this.reset(); }
            draw() { ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fillStyle=`rgba(108,92,231,${this.opacity})`; ctx.fill(); }
        }
        function initParticles() { particles=[]; const count=Math.min(60,Math.floor(window.innerWidth*window.innerHeight/18000)); for(let i=0;i<count;i++) particles.push(new Particle()); }
        initParticles();
        window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });
        function animateParticles() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(animateParticles); }
        animateParticles();
        window.addEventListener('mousemove', e => { mouse.x=e.clientX; mouse.y=e.clientY; });

        // ============================================================
        // TOOLS DATA
        // ============================================================
        const tools = [
            { id:'pdf-to-jpg', name:'PDF to JPG', desc:'Convert PDF pages to high-quality JPG images', icon:'fa-file-image', color:'#e17055', action:'convertPdfToJpg', category:'conversion' },
            { id:'pdf-to-png', name:'PDF to PNG', desc:'Convert PDF pages to lossless PNG images', icon:'fa-file-image', color:'#e17055', action:'convertPdfToPng', category:'conversion' },
            { id:'jpg-to-pdf', name:'JPG to PDF', desc:'Combine images into a single PDF document', icon:'fa-image', color:'#0984e3', action:'convertJpgToPdf', category:'conversion' },
            { id:'txt-to-pdf', name:'TXT to PDF', desc:'Convert plain text into a formatted PDF document', icon:'fa-file-alt', color:'#6c5ce7', action:'convertTxtToPdf', category:'conversion' },
            { id:'json-to-pdf', name:'JSON to PDF', desc:'Generate a structured PDF table from JSON data', icon:'fa-code', color:'#6c5ce7', action:'jsonToPdf', category:'data' },
            { id:'csv-to-pdf', name:'CSV to PDF', desc:'Convert CSV data into a neat PDF table', icon:'fa-table', color:'#00cec9', action:'convertCsvToPdf', category:'data' },
            { id:'compress-pdf', name:'Compress PDF', desc:'Shrink a PDF\'s file size for easier sharing', icon:'fa-compress-arrows-alt', color:'#d63031', action:'compressPdf', category:'optimization' },
            { id:'watermark-pdf', name:'Watermark PDF', desc:'Add a text or logo watermark to every page', icon:'fa-stamp', color:'#0984e3', action:'watermarkPdf', category:'security' },
            { id:'pdf-signer', name:'PDF Signer', desc:'Draw or upload a signature to sign a PDF', icon:'fa-signature', color:'#00b894', action:'pdfSigner', category:'security' },
            { id:'redactor', name:'PDF Redactor', desc:'Draw black boxes to hide sensitive info', icon:'fa-mask', color:'#e17055', action:'redactor', category:'security' },
            { id:'page-organizer', name:'Page Organizer', desc:'Reorder, delete, or extract pages', icon:'fa-th-large', color:'#a29bfe', action:'pageOrganizer', category:'organize' },
            { id:'rotate-pages', name:'Rotate Pages', desc:'Rotate pages that scanned sideways', icon:'fa-undo-alt', color:'#fdcb6e', action:'rotatePages', category:'organize' },
            { id:'add-page-numbers', name:'Add Page Numbers', desc:'Auto-number pages with a custom position', icon:'fa-hashtag', color:'#00b894', action:'addPageNumbers', category:'organize' },
            { id:'merge-split', name:'Merge & Split', desc:'Combine PDFs, or split one into pages', icon:'fa-object-group', color:'#2d7d9a', action:'mergeSplit', category:'organize' },
            { id:'extract-images', name:'Extract Images', desc:'Pull the embedded images out of a PDF', icon:'fa-images', color:'#0984e3', action:'extractImages', category:'media' },
            { id:'metadata', name:'Metadata Editor', desc:'View, edit, or wipe a PDF\'s hidden info', icon:'fa-info-circle', color:'#636e72', action:'metadataEditor', category:'optimization' },
            { id:'html-to-pdf', name:'HTML to PDF', desc:'Turn pasted HTML code into a PDF', icon:'fa-code', color:'#e17055', action:'convertHtmlToPdf', category:'conversion' },
        ];

        // ============================================================
        // GUIDES — specific "when" + "how" per tool, shown right in the tool screen
        // ============================================================
        const GUIDES = {
            convertPdfToJpg: { when:'When a site, app, or person needs image files instead of a PDF.', steps:['Tap the upload box and choose your PDF','Wait while each page renders (a moment per page)','A ZIP with one JPG per page downloads automatically'], tip:'Great before uploading a document to a form that only accepts images.' },
            convertPdfToPng: { when:'When the PDF has diagrams, screenshots, or fine text you\'ll zoom into later.', steps:['Tap the upload box and choose your PDF','Each page renders at full quality','A ZIP with one PNG per page downloads automatically'], tip:'PNG keeps sharp edges — pick it over JPG for anything with thin lines or text.' },
            convertJpgToPdf: { when:'When you have loose photos — scanned pages, receipts, ID cards — that need to become one file.', steps:['Choose one or more images (order = the order you pick them in)','Check the thumbnail preview','Tap "Create PDF" to download the combined file'], tip:'Select multiple images from your gallery at once to keep them all in one document.' },
            convertTxtToPdf: { when:'When you\'ve written or copied plain text and need a real PDF fast, without opening a word processor.', steps:['Paste or type your text into the box','Adjust the font size if needed','Tap "Generate PDF"'], tip:'Long text automatically flows onto new pages.' },
            jsonToPdf: { when:'When you exported data from an app or API as JSON and need a printable record of it.', steps:['Paste a JSON array of objects, e.g. [{"name":"Sam","age":30}]','Make sure every object shares the same keys for a clean table','Tap "Generate PDF"'], tip:'Best for flat data — deeply nested JSON prints as raw text inside a cell.' },
            convertCsvToPdf: { when:'When you exported a spreadsheet (Excel, Google Sheets) as CSV and need a printable table.', steps:['Choose your .csv file','The first row becomes the column headers','Tap "Convert to PDF"'], tip:'Handles quoted fields and commas-inside-quotes correctly — real CSV parsing, not a simple split.' },
            compressPdf: { when:'When a PDF is too large to email or upload and needs to shrink without changing its content.', steps:['Choose your PDF','Tap "Compress PDF"'], tip:'This is safe structural cleanup — for PDFs made of scanned photos, savings are often modest since images aren\'t re-encoded.' },
            watermarkPdf: { when:'Before sharing a draft, a confidential report, or anything you want branded with your logo.', steps:['Choose your PDF','Pick text or image watermark','Set size/opacity (text) or upload a logo (image), then tap "Add Watermark"'], tip:'Lower the opacity to 0.15–0.3 so the watermark doesn\'t obscure the original text.' },
            pdfSigner: { when:'When you\'re asked to sign a form, contract, or agreement and don\'t have a printer or scanner.', steps:['Choose your PDF','Draw your signature with your finger (or tap "Upload Signature" for an image)','Tap "Apply Signature" — it\'s placed bottom-right on page 1'], tip:'Draw slower on a touchscreen for a smoother, more natural signature line.' },
            redactor: { when:'Before sharing a document that contains something sensitive — an account number, an address, a private note.', steps:['Choose your PDF','Drag your finger on the page to draw black boxes over anything sensitive','Use the ◀ ▶ buttons for other pages, then tap "Apply Redactions"'], tip:'The box is drawn permanently into the exported file — it\'s not a removable text layer, so it\'s safe to share afterward.' },
            pageOrganizer: { when:'When a scanned PDF came out in the wrong order, has a blank page, or you only need certain pages.', steps:['Choose your PDF — thumbnails of every page load','Use ↑ / ↓ to reorder, × to delete a page','Tap "Save Order & Download" once you\'re happy'], tip:'Nothing changes until you tap Save — feel free to experiment with the order first.' },
            rotatePages: { when:'When pages were scanned sideways or upside-down and need straightening.', steps:['Choose your PDF','Pick the rotation angle and whether it applies to all pages or just some','Tap "Rotate"'], tip:'For "selected" pages, list numbers separated by commas, e.g. 1,3,5.' },
            addPageNumbers: { when:'Before printing or submitting a multi-page document — a report, thesis, or packet.', steps:['Choose your PDF','Pick position, starting number, and font size','Tap "Add Page Numbers"'], tip:'Use a start number other than 1 if this PDF continues from another document.' },
            mergeSplit: { when:'Merge: you have several PDFs that need to become one file. Split: one PDF needs to become individual pages.', steps:['Pick Merge or Split mode','Choose your file(s) — multiple for merge, one for split','Tap "Execute"'], tip:'For split, choose "ZIP archive" to get one download instead of dozens of separate files.' },
            extractImages: { when:'When a PDF contains photos or graphics you need as standalone image files.', steps:['Choose your PDF','Tap "Extract Images" and wait while every page is scanned','A ZIP of every image found downloads automatically'], tip:'Works on PDFs with embedded photos, logos, or scans — pure vector drawings won\'t appear since they aren\'t stored as images.' },
            metadataEditor: { when:'Before sending a PDF externally, if you don\'t want it revealing who created it or what software made it.', steps:['Choose your PDF — its Title/Author/Subject/Keywords load into the form','Edit any field, or tap "Wipe All Metadata"','Tap "Save Metadata" to download the updated file'], tip:'Wiping clears the visible fields shown here — treat it as tidying, not forensic erasure.' },
            convertHtmlToPdf: { when:'When you have raw HTML — an email template, a saved page snippet — and need a PDF of how it renders.', steps:['Paste your HTML code into the box','Tap "Convert to PDF"','The rendered page downloads as a PDF'], tip:'Images/fonts referenced by URL need internet access to load while rendering.' }
        };

        function seenGuides() { try { return JSON.parse(localStorage.getItem('doctools_guides_seen')) || []; } catch(e) { return []; } }
        function markGuideSeen(id) { const s = seenGuides(); if (!s.includes(id)) { s.push(id); localStorage.setItem('doctools_guides_seen', JSON.stringify(s)); } }

        // ============================================================
        // RENDER TOOLS LIST (search + category)
        // ============================================================
        let activeCategory = 'all', searchQuery = '';
        function renderTools() {
            const list = document.getElementById('toolsList');
            const noResults = document.getElementById('noResults');
            let filtered = activeCategory === 'all' ? tools : tools.filter(t => t.category === activeCategory);
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(t => t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q));
            }
            if (filtered.length === 0) { list.innerHTML = ''; noResults.style.display = 'block'; return; }
            noResults.style.display = 'none';
            list.innerHTML = filtered.map(tool => `
                <div class="tool-row" style="--tool-color:${tool.color};" onclick="openTool('${tool.action}','${tool.id}')">
                    <div class="icon-wrapper"><i class="fas ${tool.icon}"></i></div>
                    <div class="tool-text">
                        <h3>${tool.name}</h3>
                        <p>${tool.desc}</p>
                        <span class="tool-badge-sm">${tool.category}</span>
                    </div>
                    <i class="fas fa-chevron-right chev"></i>
                </div>
            `).join('');
        }
        document.getElementById('chipsRow').addEventListener('click', e => {
            const btn = e.target.closest('.chip-btn');
            if (!btn) return;
            document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeCategory = btn.dataset.category;
            renderTools();
        });
        document.getElementById('searchInput').addEventListener('input', e => { searchQuery = e.target.value; renderTools(); });
        renderTools();

        // ============================================================
        // RECENT FILES
        // ============================================================
        function getRecentFiles() { try { return JSON.parse(localStorage.getItem('doctools_recent')) || []; } catch(e) { return []; } }
        function addRecentFile(name, action) {
            let recents = getRecentFiles().filter(r => r.name !== name);
            recents.unshift({ name, action, time: Date.now() });
            if (recents.length > 8) recents = recents.slice(0, 8);
            localStorage.setItem('doctools_recent', JSON.stringify(recents));
            renderRecentFiles();
        }
        function renderRecentFiles() {
            const recents = getRecentFiles();
            const bar = document.getElementById('recentFilesBar');
            const list = document.getElementById('recentFilesList');
            if (recents.length === 0) { bar.style.display = 'none'; return; }
            bar.style.display = 'flex';
            list.innerHTML = recents.map(r => `<span class="recent-item">${r.name.length > 18 ? r.name.slice(0,18)+'…' : r.name}</span>`).join('');
        }
        renderRecentFiles();

        // ============================================================
        // QUICKSTART MODAL
        // ============================================================
        function openQuickstart() {
            document.getElementById('modalContent').innerHTML = `
                <button class="modal-close" onclick="closeQuickstart()"><i class="fas fa-times"></i></button>
                <div class="modal-header"><div class="modal-icon"><i class="fas fa-circle-question"></i></div><h2>How DOCTOOLS works</h2><p>Free, private, runs entirely in your browser</p></div>
                <div class="qs-step"><div class="qs-num">1</div><p><strong>Pick a tool</strong> from the list — search or filter by category to find it fast.</p></div>
                <div class="qs-step"><div class="qs-num">2</div><p><strong>The tool opens full-screen</strong> with a short "when to use it" note right at the top, and a full guide one tap away via the <i class="fas fa-circle-question"></i> button.</p></div>
                <div class="qs-step"><div class="qs-num">3</div><p><strong>Upload or paste your content</strong>, adjust any options, then tap the button at the bottom.</p></div>
                <div class="qs-step"><div class="qs-num">4</div><p><strong>Your file downloads automatically</strong> — nothing is ever sent to a server. Every tool runs right there on your device.</p></div>
                <div class="qs-step"><div class="qs-num">5</div><p><strong>100% free</strong>, no account, no watermark on your output.</p></div>
            `;
            document.getElementById('modalOverlay').classList.add('active');
        }
        function closeQuickstart() { document.getElementById('modalOverlay').classList.remove('active'); }
        document.getElementById('helpToggle').addEventListener('click', openQuickstart);
        document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeQuickstart(); });

        // ============================================================
        // TOOL SCREEN NAVIGATION (full-screen, with real back-button support)
        // ============================================================
        let currentToolId = '', currentFiles = [];
        const toolScreen = document.getElementById('toolScreen');

        function openTool(action, toolId) {
            currentToolId = toolId; currentFiles = [];
            const tool = tools.find(t => t.id === toolId) || tools.find(t => t.action === action);
            if (!tool) return;
            toolScreen.style.setProperty('--tool-color', tool.color);
            document.getElementById('toolIconMini').innerHTML = `<i class="fas ${tool.icon}"></i>`;
            document.getElementById('toolTitle').textContent = tool.name;
            const guide = GUIDES[action];
            document.getElementById('toolWhen').textContent = guide ? guide.when : tool.desc;

            const drawer = document.getElementById('toolGuideDrawer');
            if (guide) {
                drawer.innerHTML = `
                    <div class="g-label">How to use it</div>
                    <ol>${guide.steps.map(s => `<li>${s}</li>`).join('')}</ol>
                    <div class="guide-tip"><i class="fas fa-lightbulb"></i>${guide.tip}</div>`;
                const firstTime = !seenGuides().includes(toolId);
                drawer.classList.toggle('open', firstTime);
                if (firstTime) markGuideSeen(toolId);
            } else { drawer.innerHTML = ''; drawer.classList.remove('open'); }

            const { bodyHTML, actionHTML } = getToolHTML(action, toolId);
            document.getElementById('toolBody').innerHTML = bodyHTML;
            document.getElementById('toolActionBar').innerHTML = actionHTML;

            toolScreen.classList.add('active');
            document.body.style.overflow = 'hidden';
            history.pushState({ doctoolsTool: toolId }, '', '#' + toolId);

            const uploadArea = document.getElementById('toolBody').querySelector('.upload-area');
            if (uploadArea) setupDragDrop(uploadArea);

            if (action === 'redactor') setTimeout(() => initRedactor(), 260);
            if (action === 'pdfSigner') setTimeout(() => setupSignatureTouch(), 260);
        }

        function exitToolScreen() {
            toolScreen.classList.remove('active');
            document.body.style.overflow = '';
            currentToolId = ''; currentFiles = [];
        }
        window.addEventListener('popstate', () => { exitToolScreen(); });
        document.getElementById('toolBackBtn').addEventListener('click', () => history.back());
        // Reused by every tool function below on success — keeps a single exit path.
        function closeModal() { if (toolScreen.classList.contains('active')) history.back(); }

        document.getElementById('toolGuideBtn').addEventListener('click', () => {
            document.getElementById('toolGuideDrawer').classList.toggle('open');
        });

        // Global drag & drop with overlay (works on the home screen)
        const dragOverlay = document.getElementById('dragOverlay');
        document.addEventListener('dragover', e => { if (!toolScreen.classList.contains('active')) { e.preventDefault(); dragOverlay.classList.add('show'); } });
        document.addEventListener('dragleave', () => dragOverlay.classList.remove('show'));
        document.addEventListener('drop', e => {
            if (toolScreen.classList.contains('active')) return;
            e.preventDefault();
            dragOverlay.classList.remove('show');
            const files = e.dataTransfer.files;
            if (!files.length) return;
            const ext = files[0].name.split('.').pop().toLowerCase();
            let action = '';
            if (ext === 'pdf') action = 'convertPdfToJpg';
            else if (['jpg','jpeg','png','gif','webp'].includes(ext)) action = 'convertJpgToPdf';
            else if (ext === 'csv') action = 'convertCsvToPdf';
            else if (ext === 'txt') action = 'convertTxtToPdf';
            else if (ext === 'json') action = 'jsonToPdf';
            else return;
            const tool = tools.find(t => t.action === action);
            if (tool) {
                openTool(action, tool.id);
                currentFiles = files;
                displayFileInfo();
                const btn = document.getElementById('actionBtn');
                if (btn) btn.disabled = false;
                showPreviewForAction(action);
                checkFileSize(files);
            }
        });

        // ============================================================
        // PER-TOOL HTML (body = scrollable workspace, actionHTML = sticky bottom bar)
        // ============================================================
        function getToolHTML(action, toolId) {
            let bodyHTML = '', actionHTML = '';
            const progress = `<div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>`;
            switch (action) {
                case 'convertPdfToJpg':
                case 'convertPdfToPng': {
                    const isPng = action === 'convertPdfToPng';
                    bodyHTML = `<div class="upload-area" onclick="triggerFileInput('pdf')"><i class="fas fa-cloud-upload-alt"></i><p>Tap to choose a PDF, or drop it here</p><p class="sub-text">Each page becomes a ${isPng?'PNG':'JPG'}</p></div><div id="fileInfoContainer"></div><div id="previewContainer" class="preview-container" style="display:none;"></div>`;
                    actionHTML = `${progress}<button class="btn btn-primary" onclick="${action}()" id="actionBtn" disabled><i class="fas fa-play"></i> Start Conversion</button>`;
                    break;
                }
                case 'convertJpgToPdf':
                    bodyHTML = `<div class="upload-area" onclick="triggerFileInput('image')"><i class="fas fa-cloud-upload-alt"></i><p>Tap to choose images, or drop them here</p><p class="sub-text">You can select multiple images at once</p></div><div id="fileInfoContainer"></div><div id="previewContainer" class="preview-container"></div>`;
                    actionHTML = `${progress}<button class="btn btn-primary" onclick="convertJpgToPdf()" id="actionBtn" disabled><i class="fas fa-play"></i> Create PDF</button>`;
                    break;
                case 'convertTxtToPdf':
                    bodyHTML = `<div class="form-group"><label>Text to convert</label><textarea id="txtContent" placeholder="Type or paste your text here..."></textarea></div><div class="form-group"><label>Font size (px)</label><input type="number" id="fontSize" value="14" min="8" max="72"></div>`;
                    actionHTML = `<button class="btn btn-primary" onclick="convertTxtToPdf()" id="actionBtn"><i class="fas fa-play"></i> Generate PDF</button>`;
                    break;
                case 'jsonToPdf':
                    bodyHTML = `<div class="form-group"><label>Paste JSON data</label><textarea id="jsonData" placeholder='[{"name":"John","age":30}]'></textarea></div>`;
                    actionHTML = `<button class="btn btn-primary" onclick="jsonToPdf()" id="actionBtn"><i class="fas fa-play"></i> Generate PDF</button>`;
                    break;
                case 'convertCsvToPdf':
                    bodyHTML = `<div class="upload-area" onclick="triggerFileInput('csv')"><i class="fas fa-cloud-upload-alt"></i><p>Tap to choose a CSV file</p><p class="sub-text">Rendered as a PDF table — handles quotes & multiline</p></div><div id="fileInfoContainer"></div>`;
                    actionHTML = `${progress}<button class="btn btn-primary" onclick="convertCsvToPdf()" id="actionBtn" disabled><i class="fas fa-play"></i> Convert to PDF</button>`;
                    break;
                case 'compressPdf':
                    bodyHTML = `<div class="upload-area" onclick="triggerFileInput('pdf')"><i class="fas fa-cloud-upload-alt"></i><p>Tap to choose a PDF</p><p class="sub-text">Structural cleanup to shrink the file</p></div><div id="fileInfoContainer"></div>`;
                    actionHTML = `${progress}<button class="btn btn-primary" onclick="compressPdf()" id="actionBtn" disabled><i class="fas fa-play"></i> Compress PDF</button>`;
                    break;
                case 'watermarkPdf':
                    bodyHTML = `<div class="upload-area" onclick="triggerFileInput('pdf')"><i class="fas fa-cloud-upload-alt"></i><p>Tap to choose a PDF</p><p class="sub-text">Add text or image watermark</p></div><div id="fileInfoContainer"></div><div class="form-group"><label>Watermark type</label><select id="wmType" onchange="document.getElementById('wmTextGroup').style.display=this.value==='text'?'flex':'none';document.getElementById('wmImageGroup').style.display=this.value==='image'?'block':'none';"><option value="text">Text</option><option value="image">Image (logo)</option></select></div><div id="wmTextGroup" style="display:flex;flex-direction:column;gap:12px;"><div class="form-group"><label>Watermark text</label><input type="text" id="watermarkText" value="CONFIDENTIAL"></div><div class="form-group"><label>Font size</label><input type="number" id="watermarkSize" value="30" min="10" max="100"></div><div class="form-group"><label>Opacity (0-1)</label><input type="number" id="watermarkOpacity" value="0.3" min="0" max="1" step="0.1"></div></div><div id="wmImageGroup" style="display:none;"><div class="form-group"><label>Choose image (logo)</label><input type="file" id="wmImageInput" accept="image/*"></div></div>`;
                    actionHTML = `${progress}<button class="btn btn-primary" onclick="watermarkPdf()" id="actionBtn" disabled><i class="fas fa-play"></i> Add Watermark</button>`;
                    break;
                case 'pdfSigner':
                    bodyHTML = `<div class="upload-area" onclick="triggerFileInput('pdf')"><i class="fas fa-cloud-upload-alt"></i><p>Tap to choose a PDF</p></div><div id="fileInfoContainer"></div><div id="signCanvasFill" class="canvas-fill"><canvas id="signCanvas" width="400" height="220"></canvas></div><div style="display:flex;gap:8px;"><button class="btn btn-secondary btn-sm" onclick="clearSignature()">Clear</button><button class="btn btn-secondary btn-sm" onclick="document.getElementById('signUpload').click()">Upload Signature</button><input type="file" id="signUpload" accept="image/*" style="display:none;" onchange="uploadSignature(event)"></div>`;
                    actionHTML = `<button class="btn btn-primary" onclick="pdfSigner()" id="actionBtn" disabled><i class="fas fa-play"></i> Apply Signature</button>`;

        // ============================================================
        // FILE INPUT & DRAG DROP HELPERS
        // ============================================================
        function triggerFileInput(type) {
            const input = document.getElementById('fileInput');
            if (type === 'image') input.accept = 'image/*';
            else if (type === 'pdf') input.accept = '.pdf,application/pdf';
            else if (type === 'csv') input.accept = '.csv,text/csv';
            else input.accept = '*/*';
            input.multiple = (type === 'image' || type === 'pdf');
            input.onchange = function(e) {
                if (e.target.files.length > 0) {
                    currentFiles = e.target.files;
                    displayFileInfo();
                    const btn = document.getElementById('actionBtn');
                    if (btn) btn.disabled = false;
                    showPreviewForAction();
                    checkFileSize(e.target.files);
                }
            };
            input.click();
        }
        function setupDragDrop(element) {
            element.addEventListener('dragover', e => { e.preventDefault(); element.classList.add('dragover'); });
            element.addEventListener('dragleave', () => element.classList.remove('dragover'));
            element.addEventListener('drop', e => {
                e.preventDefault();
                element.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    currentFiles = e.dataTransfer.files;
                    displayFileInfo();
                    const btn = document.getElementById('actionBtn');
                    if (btn) btn.disabled = false;
                    showPreviewForAction();
                    checkFileSize(e.dataTransfer.files);
                }
            });
        }
        function displayFileInfo() {
            const container = document.getElementById('fileInfoContainer');
            if (!container || !currentFiles || !currentFiles.length) return;
            const fileNames = Array.from(currentFiles).map(f => f.name).join(', ');
            const totalSize = Array.from(currentFiles).reduce((s,f) => s+f.size, 0);
            const sizeStr = formatFileSize(totalSize);
            const warning = totalSize > 50*1024*1024 ? `<span class="file-size-warning"><i class="fas fa-exclamation-triangle"></i> Large (${sizeStr})</span>` : '';
            container.innerHTML = `<div class="file-info"><i class="fas fa-file"></i><span>${currentFiles.length} file(s): ${fileNames} (${sizeStr})</span>${warning}</div>`;
            if (currentFiles.length === 1) {
                const tool = tools.find(t => t.id === currentToolId);
                if (tool) addRecentFile(currentFiles[0].name, tool.action);
            }
        }
        function checkFileSize(files) {
            let total = 0; for (let f of files) total += f.size;
            if (total > 50*1024*1024) showToast('Large file detected (>50MB) — performance may be affected', false);
        }
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
            return (bytes/1048576).toFixed(2) + ' MB';
        }
        function showPreviewForAction() {
            const previewContainer = document.getElementById('previewContainer');
            if (!previewContainer) return;
            const tool = tools.find(t => t.id === currentToolId);
            const action = tool ? tool.action : '';
            if (action === 'convertJpgToPdf') {
                previewContainer.style.display = 'block';
                previewContainer.innerHTML = '<div class="preview-grid"></div>';
                const grid = previewContainer.querySelector('.preview-grid');
                Array.from(currentFiles).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = e => { const img = document.createElement('img'); img.src = e.target.result; img.className = 'thumb'; grid.appendChild(img); };
                    reader.readAsDataURL(file);
                });
            } else if (['convertPdfToJpg','convertPdfToPng'].includes(action)) {
                if (currentFiles.length > 0 && currentFiles[0].type === 'application/pdf') {
                    previewContainer.style.display = 'block';
                    previewContainer.innerHTML = '<p>Preview loading…</p>';
                    const file = currentFiles[0];
                    const reader = new FileReader();
                    reader.onload = async e => {
                        try {
                            const pdfjsLib = window.pdfjsLib;
                            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                            const pdf = await pdfjsLib.getDocument({ data: e.target.result }).promise;
                            const page = await pdf.getPage(1);
                            const viewport = page.getViewport({ scale: 1.0 });
                            const c = document.createElement('canvas'); c.width=viewport.width; c.height=viewport.height;
                            await page.render({ canvasContext: c.getContext('2d'), viewport }).promise;
                            const img = new Image(); img.src = c.toDataURL('image/png'); img.style.maxWidth='100%'; img.style.maxHeight='170px';
                            previewContainer.innerHTML = ''; previewContainer.appendChild(img);
                        } catch (err) { previewContainer.innerHTML = `<p>Preview error: ${err.message}</p>`; }
                    };
                    reader.readAsArrayBuffer(file);
                }
            }
        }

        // ============================================================
        // TOAST & PROGRESS
        // ============================================================
        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            icon.className = isSuccess ? 'fas fa-check-circle success' : 'fas fa-exclamation-circle error';
            document.getElementById('toastMessage').textContent = message;
            toast.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toast.classList.remove('show'), 3200);
        }
        function showProgress(percent, spinner = false) {
            const bar = document.getElementById('progressBar'), fill = document.getElementById('progressFill');
            if (bar && fill) { bar.classList.add('active'); fill.style.width = Math.min(percent,100) + '%'; }
            if (spinner) { const btn = document.getElementById('actionBtn'); if (btn) { btn.innerHTML = '<span class="loading-spinner"></span> Processing...'; btn.disabled = true; } }
        }
        function hideProgress() {
            const bar = document.getElementById('progressBar'); if (bar) bar.classList.remove('active');
            const btn = document.getElementById('actionBtn'); if (btn) { btn.innerHTML = '<i class="fas fa-play"></i> Done'; btn.disabled = false; }
        }
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }

        // ============================================================
        // CANVAS FIT-TO-CONTAINER HELPER (fixes "needs desktop view" bug)
        // ============================================================
        function getFitScale(containerEl, naturalW, naturalH, maxScale) {
            const availW = containerEl.clientWidth || 320;
            const availH = containerEl.clientHeight || 400;
            const scale = Math.min(availW / naturalW, availH / naturalH, maxScale || 4);
            return Math.max(scale, 0.15);
        }

        async function convertTxtToPdf() {
            try {
                const text = document.getElementById('txtContent').value.trim();
                const fontSize = parseInt(document.getElementById('fontSize').value) || 14;
                if (!text) { showToast('Please enter text first', false); return; }
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
                const pageWidth = doc.internal.pageSize.getWidth(), pageHeight = doc.internal.pageSize.getHeight();
                const margin = 15, maxWidth = pageWidth - margin*2, lineHeight = fontSize * 0.5;
                doc.setFont('helvetica','normal'); doc.setFontSize(fontSize);
                let y = margin + lineHeight;
                for (let line of text.split('\n')) {
                    const wrapped = doc.splitTextToSize(line, maxWidth);
                    for (const w of wrapped) { if (y > pageHeight - margin) { doc.addPage(); y = margin + lineHeight; } doc.text(w, margin, y); y += lineHeight; }
                    y += lineHeight * 0.4;
                }
                doc.save('document.pdf');
                showToast('PDF generated successfully!');
                closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); hideProgress(); }
        }

        async function convertJpgToPdf() {
            if (!currentFiles || !currentFiles.length) { showToast('Please select images first', false); return; }
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const files = Array.from(currentFiles);
                for (let i = 0; i < files.length; i++) {
                    const dataUrl = await new Promise(resolve => { const r = new FileReader(); r.onload = () => resolve(r.result); r.readAsDataURL(files[i]); });
                    if (i > 0) doc.addPage();
                    const img = new Image(); img.src = dataUrl;
                    await new Promise(r => { img.onload = r; });
                    const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
                    const ratio = Math.min(pw/img.width, ph/img.height);
                    const w = img.width*ratio, h = img.height*ratio;
                    doc.addImage(dataUrl, 'JPEG', (pw-w)/2, (ph-h)/2, w, h);
                    showProgress(Math.round(((i+1)/files.length)*100));
                }
                doc.save('images-to-pdf.pdf');
                hideProgress(); showToast('PDF created from images!'); closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); hideProgress(); }
        }

        async function convertPdfToImages(format) {
            if (!currentFiles || !currentFiles.length) { showToast('Please select a PDF first', false); return; }
            try {
                const file = currentFiles[0];
                const arrayBuffer = await file.arrayBuffer();
                const pdfjsLib = window.pdfjsLib;
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const zip = new JSZip();
                const ext = format === 'png' ? 'png' : 'jpg';
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 2.0 });
                    const c = document.createElement('canvas'); c.width=viewport.width; c.height=viewport.height;
                    await page.render({ canvasContext: c.getContext('2d'), viewport }).promise;
                    const imgData = format === 'png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.9);
                    zip.file(`page_${String(pageNum).padStart(2,'0')}.${ext}`, imgData.split(',')[1], { base64: true });
                    showProgress(Math.round((pageNum/pdf.numPages)*100), true);
                }
                const zipBlob = await zip.generateAsync({ type:'blob' });
                downloadBlob(zipBlob, `pdf-to-${ext}.zip`);
                hideProgress(); showToast(`PDF converted to ${ext.toUpperCase()} images!`); closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); hideProgress(); }
        }
        async function convertPdfToJpg() { await convertPdfToImages('jpg'); }
        async function convertPdfToPng() { await convertPdfToImages('png'); }

        async function compressPdf() {
            if (!currentFiles || !currentFiles.length) { showToast('Please select a PDF first', false); return; }
            try {
                const file = currentFiles[0];
                const originalSize = file.size;
                const arrayBuffer = await file.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                const compressedBytes = await pdfDoc.save({ useObjectStreams: true, addDefaultPage: false });
                const compressedBlob = new Blob([compressedBytes], { type:'application/pdf' });
                showProgress(100, true);
                downloadBlob(compressedBlob, 'compressed-' + file.name);
                const savings = (((originalSize - compressedBlob.size) / originalSize) * 100).toFixed(1);
                showToast(savings > 0 ? `Compressed! Saved ${savings}% of original size` : 'Structural cleanup complete (file was already efficient)');
                hideProgress(); closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); hideProgress(); }
        }

        async function convertHtmlToPdf() {
            try {
                const code = document.getElementById('htmlCode').value.trim();
                if (!code) { showToast('Please paste HTML code', false); return; }
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p','mm','a4');
                showProgress(20);
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = code;
                tempDiv.style.cssText = 'position:absolute; left:-9999px; top:0; width:800px; background:#fff; padding:20px; font-family: Arial, sans-serif;';
                document.body.appendChild(tempDiv);
                showProgress(50);
                const c = await html2canvas(tempDiv, { scale:2, useCORS:true });
                const imgData = c.toDataURL('image/png');
                const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
                const ratio = Math.min(pw/c.width, ph/c.height);
                doc.addImage(imgData, 'PNG', (pw-c.width*ratio)/2, 5, c.width*ratio, c.height*ratio);
                document.body.removeChild(tempDiv);
                showProgress(100);
                doc.save('html-to-pdf.pdf');
                hideProgress(); showToast('HTML converted to PDF!'); closeModal();

        async function convertCsvToPdf() {
            if (!currentFiles || !currentFiles.length) { showToast('Please select a CSV file first', false); return; }
            try {
                const file = currentFiles[0];
                const text = await file.text();
                const result = Papa.parse(text, { header:true, skipEmptyLines:true, trimHeaders:true });
                const data = result.data.filter(row => Object.values(row).some(v => v && v.trim() !== ''));
                if (data.length === 0) { showToast('No data found in CSV', false); return; }
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('landscape','mm','a4');
                const pageWidth = doc.internal.pageSize.getWidth(), pageHeight = doc.internal.pageSize.getHeight();
                const margin = 10, tableWidth = pageWidth - margin*2;
                const headers = Object.keys(data[0]);
                const colWidth = tableWidth / headers.length, rowHeight = 8;
                doc.setFontSize(7);
                let y = margin;
                const drawHeader = () => { headers.forEach((h,i) => { doc.setFillColor(230); doc.rect(margin+i*colWidth,y,colWidth,rowHeight,'F'); doc.setTextColor(0); doc.text(h.substring(0,20), margin+i*colWidth+2, y+5); }); y += rowHeight; };
                drawHeader();
                for (let i = 0; i < data.length; i++) {
                    const row = data[i];
                    if (y > pageHeight - margin - rowHeight) { doc.addPage(); y = margin; drawHeader(); }
                    headers.forEach((h,j) => { const val = (row[h]||'').toString().trim().substring(0,30); doc.setFillColor(i%2===0?245:255); doc.rect(margin+j*colWidth,y,colWidth,rowHeight,'F'); doc.setTextColor(0); doc.text(val, margin+j*colWidth+2, y+5); });
                    y += rowHeight;
                    showProgress(Math.round((i/data.length)*100));
                }
                doc.save('csv-to-pdf.pdf');
                hideProgress(); showToast('CSV converted to PDF!'); closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); hideProgress(); }
        }

        async function jsonToPdf() {
            try {
                const jsonData = document.getElementById('jsonData').value.trim();
                if (!jsonData) { showToast('Please paste JSON data', false); return; }
                const data = JSON.parse(jsonData);
                if (!Array.isArray(data) || data.length === 0) { showToast('Please paste a JSON array of objects', false); return; }
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const keys = Object.keys(data[0] || {});
                if (keys.length === 0) { showToast('No data found', false); return; }
                doc.setFontSize(12);
                const pageWidth = doc.internal.pageSize.getWidth(), margin = 10;
                let y = margin;
                const colWidth = (pageWidth - margin*2) / keys.length;
                keys.forEach((key,i) => doc.text(String(key), margin+i*colWidth, y));
                y += 8;
                data.forEach(row => { if (y > 280) { doc.addPage(); y = margin; } keys.forEach((key,i) => doc.text(String(row[key] ?? ''), margin+i*colWidth, y)); y += 8; });
                doc.save('json-to-pdf.pdf');
                showToast('JSON converted to PDF!'); closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); }
        }

        async function watermarkPdf() {
            if (!currentFiles || !currentFiles.length) { showToast('Please select a PDF first', false); return; }
            try {
                const type = document.getElementById('wmType').value;
                const file = currentFiles[0];
                const arrayBuffer = await file.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                const pages = pdfDoc.getPages();
                if (type === 'text') {
                    const wmText = document.getElementById('watermarkText').value.trim() || 'CONFIDENTIAL';
                    const wmSize = parseInt(document.getElementById('watermarkSize').value) || 30;
                    const wmOpacity = parseFloat(document.getElementById('watermarkOpacity').value) || 0.3;
                    pages.forEach((page, idx) => {
                        const { width, height } = page.getSize();
                        const textWidth = wmSize * wmText.length * 0.55, textHeight = wmSize;
                        for (let x = -textWidth; x < width + textWidth; x += textWidth + 60) {
                            for (let y = -textHeight; y < height + textHeight; y += textHeight + 80) {
                                page.drawText(wmText, { x, y, size: wmSize, color: PDFLib.rgb(0.5,0.5,0.5), opacity: wmOpacity, rotate: PDFLib.degrees(-35) });
                            }
                        }
                        showProgress(Math.round(((idx+1)/pages.length)*100));
                    });
                } else {
                    const imgInput = document.getElementById('wmImageInput');
                    if (!imgInput || !imgInput.files || !imgInput.files.length) { showToast('Please select an image for watermark', false); return; }
                    const imgData = await imgInput.files[0].arrayBuffer();
                    let pngImage;
                    try { pngImage = await pdfDoc.embedPng(imgData); } catch (e) { pngImage = await pdfDoc.embedJpg(imgData); }
                    pages.forEach((page, idx) => {
                        const { width, height } = page.getSize();
                        const imgWidth = width * 0.3, imgHeight = imgWidth * (pngImage.height/pngImage.width);
                        page.drawImage(pngImage, { x:(width-imgWidth)/2, y:(height-imgHeight)/2, width:imgWidth, height:imgHeight, opacity:0.3 });
                        showProgress(Math.round(((idx+1)/pages.length)*100));
                    });
                }
                const watermarkedBytes = await pdfDoc.save();
                showProgress(100);
                downloadBlob(new Blob([watermarkedBytes], { type:'application/pdf' }), 'watermarked-' + file.name);
                hideProgress(); showToast('Watermark added successfully!'); closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); hideProgress(); }
        }
