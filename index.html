        }
        window.deletePage = function(btn) { btn.closest('.page-thumb').remove(); showToast('Page removed. Tap "Save Order" to apply.'); };
        window.movePageUp = function(btn) { const div = btn.closest('.page-thumb'); const prev = div.previousElementSibling; if (prev) { div.parentElement.insertBefore(div, prev); showToast('Order updated.'); } };
        window.movePageDown = function(btn) { const div = btn.closest('.page-thumb'); const next = div.nextElementSibling; if (next) { div.parentElement.insertBefore(next, div); showToast('Order updated.'); } };
        async function savePageOrder() {
            try {
                const divs = document.getElementById('pageGridContainer').querySelectorAll('.page-thumb');
                if (divs.length === 0) { showToast('No pages to save', false); return; }
                const order = Array.from(divs).map(el => parseInt(el.dataset.originalIndex));
                const file = currentFiles[0];
                const arrayBuffer = await file.arrayBuffer();
                const srcPdf = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                const newPdf = await PDFLib.PDFDocument.create();
                const copiedPages = await newPdf.copyPages(srcPdf, order);
                copiedPages.forEach(p => newPdf.addPage(p));
                const bytes = await newPdf.save();
                downloadBlob(new Blob([bytes], { type:'application/pdf' }), 'reordered-' + file.name);
                showToast('PDF reordered and downloaded!'); closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); }
        }

        // ---- PDF Signer — canvas fills available space ----
        let signCtx = null, signDrawing = false;
        function fitSignatureCanvas() {
            const canvasEl = document.getElementById('signCanvas');
            const container = document.getElementById('signCanvasFill');
            if (!canvasEl || !container) return;
            const w = Math.max(280, container.clientWidth - 4);
            const h = Math.max(180, container.clientHeight - 4);
            canvasEl.width = w; canvasEl.height = h;
            canvasEl.style.width = w + 'px'; canvasEl.style.height = h + 'px';
        }
        function setupSignatureTouch() {
            const canvasEl = document.getElementById('signCanvas');
            if (!canvasEl) return;
            fitSignatureCanvas();
            signCtx = canvasEl.getContext('2d');
            const pos = (evt, isTouch) => {
                const rect = canvasEl.getBoundingClientRect();
                const scaleX = canvasEl.width/rect.width, scaleY = canvasEl.height/rect.height;
                const p = isTouch ? evt.touches[0] : evt;
                return { x:(p.clientX-rect.left)*scaleX, y:(p.clientY-rect.top)*scaleY };
            };
            canvasEl.addEventListener('mousedown', e => { signDrawing=true; const p=pos(e); signCtx.beginPath(); signCtx.moveTo(p.x,p.y); });
            canvasEl.addEventListener('mousemove', e => { if(!signDrawing) return; const p=pos(e); signCtx.lineTo(p.x,p.y); signCtx.strokeStyle='#000'; signCtx.lineWidth=2.5; signCtx.lineCap='round'; signCtx.stroke(); });
            canvasEl.addEventListener('mouseup', () => signDrawing=false);
            canvasEl.addEventListener('mouseleave', () => signDrawing=false);
            canvasEl.addEventListener('touchstart', e => { e.preventDefault(); signDrawing=true; const p=pos(e,true); signCtx.beginPath(); signCtx.moveTo(p.x,p.y); }, { passive:false });
            canvasEl.addEventListener('touchmove', e => { e.preventDefault(); if(!signDrawing) return; const p=pos(e,true); signCtx.lineTo(p.x,p.y); signCtx.strokeStyle='#000'; signCtx.lineWidth=2.5; signCtx.lineCap='round'; signCtx.stroke(); }, { passive:false });
            canvasEl.addEventListener('touchend', () => signDrawing=false);
        }
        window.clearSignature = function() { const c = document.getElementById('signCanvas'); if (c && signCtx) signCtx.clearRect(0,0,c.width,c.height); };
        window.uploadSignature = function(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    const c = document.getElementById('signCanvas'); if (!c) return;
                    const cx = c.getContext('2d');
                    const scale = Math.min(c.width/img.width, c.height/img.height, 1);
                    const w = img.width*scale, h = img.height*scale;
                    cx.drawImage(img, (c.width-w)/2, (c.height-h)/2, w, h);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };
        async function pdfSigner() {
            if (!currentFiles || !currentFiles.length) { showToast('Please select a PDF first', false); return; }
            try {
                const file = currentFiles[0];
                const arrayBuffer = await file.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                const page = pdfDoc.getPages()[0];
                const canvasEl = document.getElementById('signCanvas'); if (!canvasEl) return;
                const pngImage = await pdfDoc.embedPng(canvasEl.toDataURL('image/png'));
                const { width, height } = page.getSize();
                page.drawImage(pngImage, { x:width-160, y:50, width:130, height:65 });
                const bytes = await pdfDoc.save();
                downloadBlob(new Blob([bytes], { type:'application/pdf' }), 'signed-' + file.name);
                showToast('Signature applied!'); closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); }
        }

        // ---- Redactor — canvas fit to container, multi-page ----
        let redactPdfDoc = null, redactCanvasEl = null, redactCtx = null;
        let redactCurrentPage = 1, redactTotalPages = 1, redactBaseImageData = null;
        let redactBoxesByPage = {}, redactStartPoint = null;

        async function initRedactor() {
            const canvasEl = document.getElementById('redactCanvas');
            if (!canvasEl || !currentFiles || !currentFiles.length) return;
            redactCanvasEl = canvasEl; redactCtx = canvasEl.getContext('2d'); redactBoxesByPage = {};
            const file = currentFiles[0];
            const arrayBuffer = await file.arrayBuffer();
            const pdfjsLib = window.pdfjsLib;
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            redactPdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            redactTotalPages = redactPdfDoc.numPages; redactCurrentPage = 1;
            await renderRedactPage(redactCurrentPage);
            attachRedactCanvasEvents();
            document.getElementById('actionBtn').disabled = false;
        }
        async function renderRedactPage(pageNum) {
            const page = await redactPdfDoc.getPage(pageNum);
            const natural = page.getViewport({ scale: 1 });
            const container = document.getElementById('redactCanvasFill');
            const scale = getFitScale(container, natural.width, natural.height, 4);
            const viewport = page.getViewport({ scale });
            redactCanvasEl.width = Math.floor(viewport.width);
            redactCanvasEl.height = Math.floor(viewport.height);
            redactCanvasEl.style.width = Math.floor(viewport.width) + 'px';
            redactCanvasEl.style.height = Math.floor(viewport.height) + 'px';
            await page.render({ canvasContext: redactCtx, viewport }).promise;
            redactBaseImageData = redactCtx.getImageData(0, 0, redactCanvasEl.width, redactCanvasEl.height);
            drawExistingBoxes();
            const indicator = document.getElementById('redactPageIndicator');
            if (indicator) indicator.textContent = `Page ${pageNum} / ${redactTotalPages}`;
        }
        function drawExistingBoxes() {
            const boxes = redactBoxesByPage[redactCurrentPage] || [];
            redactCtx.putImageData(redactBaseImageData, 0, 0);
            boxes.forEach(r => { redactCtx.fillStyle = 'rgba(0,0,0,0.9)'; redactCtx.fillRect(r.x, r.y, r.w, r.h); });
        }
        window.redactChangePage = async function(delta) {
            const next = redactCurrentPage + delta;
            if (next < 1 || next > redactTotalPages) return;
            redactCurrentPage = next;
            await renderRedactPage(redactCurrentPage);
        };
        window.clearRedactionsOnPage = function() { redactBoxesByPage[redactCurrentPage] = []; drawExistingBoxes(); showToast('Cleared redactions on this page'); };
        function attachRedactCanvasEvents() {
            const canvasEl = redactCanvasEl;
            const posFrom = (evt, isTouch) => {
                const rect = canvasEl.getBoundingClientRect();
                const scaleX = canvasEl.width/rect.width, scaleY = canvasEl.height/rect.height;
                const p = isTouch ? (evt.touches[0] || evt.changedTouches[0]) : evt;
                return { x:(p.clientX-rect.left)*scaleX, y:(p.clientY-rect.top)*scaleY };
            };
            const startDraw = p => { redactStartPoint = p; };
            const moveDraw = p => {
                if (!redactStartPoint) return;
                drawExistingBoxes();
                const w = p.x-redactStartPoint.x, h = p.y-redactStartPoint.y;
                redactCtx.fillStyle='rgba(0,0,0,0.5)'; redactCtx.strokeStyle='#ff0000'; redactCtx.lineWidth=2;
                redactCtx.fillRect(redactStartPoint.x, redactStartPoint.y, w, h);
                redactCtx.strokeRect(redactStartPoint.x, redactStartPoint.y, w, h);
            };
            const endDraw = p => {
                if (!redactStartPoint) return;
                const w = p.x-redactStartPoint.x, h = p.y-redactStartPoint.y;
                if (Math.abs(w) > 5 && Math.abs(h) > 5) {
                    if (!redactBoxesByPage[redactCurrentPage]) redactBoxesByPage[redactCurrentPage] = [];
                    redactBoxesByPage[redactCurrentPage].push({ x:Math.min(redactStartPoint.x,p.x), y:Math.min(redactStartPoint.y,p.y), w:Math.abs(w), h:Math.abs(h) });
                    drawExistingBoxes();
                }
                redactStartPoint = null;
            };
            canvasEl.addEventListener('mousedown', e => startDraw(posFrom(e)));
            canvasEl.addEventListener('mousemove', e => moveDraw(posFrom(e)));
            canvasEl.addEventListener('mouseup', e => endDraw(posFrom(e)));
            canvasEl.addEventListener('touchstart', e => { e.preventDefault(); startDraw(posFrom(e,true)); }, { passive:false });
            canvasEl.addEventListener('touchmove', e => { e.preventDefault(); moveDraw(posFrom(e,true)); }, { passive:false });
            canvasEl.addEventListener('touchend', e => { e.preventDefault(); endDraw(posFrom(e,true)); }, { passive:false });
        }
        async function applyRedactions() {
            const hasAny = Object.values(redactBoxesByPage).some(arr => arr && arr.length);
            if (!hasAny) { showToast('No redactions to apply — draw at least one box', false); return; }
            try {
                const file = currentFiles[0];
                const arrayBuffer = await file.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                const pages = pdfDoc.getPages();
                for (const pageNumStr of Object.keys(redactBoxesByPage)) {
                    const pageNum = parseInt(pageNumStr);
                    const boxes = redactBoxesByPage[pageNum];
                    if (!boxes || !boxes.length) continue;
                    const page = pages[pageNum-1]; if (!page) continue;
                    const { width, height } = page.getSize();
                    const scaleX = width/redactCanvasEl.width, scaleY = height/redactCanvasEl.height;
                    boxes.forEach(r => page.drawRectangle({ x:r.x*scaleX, y:height-(r.y+r.h)*scaleY, width:r.w*scaleX, height:r.h*scaleY, color:PDFLib.rgb(0,0,0) }));
                }
                const bytes = await pdfDoc.save();
                downloadBlob(new Blob([bytes], { type:'application/pdf' }), 'redacted-' + file.name);
                showToast('Redactions applied!'); closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); }
        }

        async function rotatePages() {
            if (!currentFiles || !currentFiles.length) { showToast('Please select a PDF first', false); return; }
            try {
                const angle = parseInt(document.getElementById('rotateAngle').value);
                const scope = document.getElementById('rotateScope').value;
                const pagesList = document.getElementById('rotatePagesList').value;
                const file = currentFiles[0];
                const arrayBuffer = await file.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                const totalPages = pdfDoc.getPageCount();
                let pagesToRotate = [];
                if (scope === 'all') { for (let i=0;i<totalPages;i++) pagesToRotate.push(i); }
                else {
                    const nums = pagesList.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n>0 && n<=totalPages);
                    pagesToRotate = nums.map(n => n-1);
                    if (pagesToRotate.length === 0) { showToast('Invalid page numbers', false); return; }
                }
                const pages = pdfDoc.getPages();
                pagesToRotate.forEach(idx => { if (pages[idx]) pages[idx].setRotation(PDFLib.degrees(angle)); });
                const bytes = await pdfDoc.save();
                downloadBlob(new Blob([bytes], { type:'application/pdf' }), 'rotated-' + file.name);
                showToast(`Rotated ${pagesToRotate.length} page(s)!`); closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); }
        }

        async function addPageNumbers() {
            if (!currentFiles || !currentFiles.length) { showToast('Please select a PDF first', false); return; }
            try {
                const position = document.getElementById('pnPosition').value;
                const startNum = parseInt(document.getElementById('pnStart').value) || 1;
                const fontSize = parseInt(document.getElementById('pnSize').value) || 12;
                const file = currentFiles[0];
                const arrayBuffer = await file.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                const pages = pdfDoc.getPages(); const total = pages.length;
                pages.forEach((page, idx) => {
                    const num = startNum + idx;
                    const { width, height } = page.getSize();
                    let x, y;
                    switch (position) {
                        case 'bottom-center': x=width/2; y=20; break;
                        case 'bottom-right': x=width-30; y=20; break;
                        case 'top-center': x=width/2; y=height-20; break;
                        case 'top-right': x=width-30; y=height-20; break;
                        default: x=width/2; y=20;
                    }
                    page.drawText(`${num} / ${startNum+total-1}`, { x, y, size:fontSize, color:PDFLib.rgb(0.2,0.2,0.2) });
                    showProgress(Math.round(((idx+1)/total)*100));
                });
                const bytes = await pdfDoc.save();
                downloadBlob(new Blob([bytes], { type:'application/pdf' }), 'numbered-' + file.name);
                showToast('Page numbers added!'); hideProgress(); closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); hideProgress(); }
        }

        async function mergeSplit() {
            if (!currentFiles || !currentFiles.length) { showToast('Please select PDF(s)', false); return; }
            try {
                const mode = document.getElementById('mergeSplitMode').value;
                const splitOutput = document.getElementById('splitOutput')?.value || 'zip';
                if (mode === 'merge') {
                    if (currentFiles.length < 2) { showToast('Select at least 2 PDFs to merge', false); return; }
                    const mergedPdf = await PDFLib.PDFDocument.create();
                    for (const file of currentFiles) {
                        const arrayBuffer = await file.arrayBuffer();
                        const src = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                        const pages = await mergedPdf.copyPages(src, src.getPageIndices());
                        pages.forEach(p => mergedPdf.addPage(p));
                        showProgress(50);
                    }
                    const bytes = await mergedPdf.save();
                    downloadBlob(new Blob([bytes], { type:'application/pdf' }), 'merged.pdf');
                    hideProgress(); showToast('PDFs merged!'); closeModal();
                } else {
                    const file = currentFiles[0];
                    const arrayBuffer = await file.arrayBuffer();
                    const src = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                    const totalPages = src.getPageCount();
                    if (splitOutput === 'zip') {
                        const zip = new JSZip();
                        for (let i=0;i<totalPages;i++) {
                            const newPdf = await PDFLib.PDFDocument.create();
                            const [page] = await newPdf.copyPages(src, [i]);
                            newPdf.addPage(page);
                            zip.file(`page_${i+1}.pdf`, await newPdf.save());
                            showProgress(Math.round((i/totalPages)*100));
                        }
                        downloadBlob(await zip.generateAsync({ type:'blob' }), 'split-pages.zip');
                    } else {
                        for (let i=0;i<totalPages;i++) {
                            const newPdf = await PDFLib.PDFDocument.create();
                            const [page] = await newPdf.copyPages(src, [i]);
                            newPdf.addPage(page);
                            downloadBlob(new Blob([await newPdf.save()], { type:'application/pdf' }), `page_${i+1}.pdf`);
                            showProgress(Math.round((i/totalPages)*100));
                        }
                    }
                    hideProgress(); showToast('PDF split into ' + totalPages + ' pages!'); closeModal();
                }
            } catch (err) { showToast('Error: ' + err.message, false); hideProgress(); }
        }

        async function extractImages() {
            if (!currentFiles || !currentFiles.length) { showToast('Please select a PDF first', false); return; }
            try {
                const file = currentFiles[0];
                const arrayBuffer = await file.arrayBuffer();
                const pdfjsLib = window.pdfjsLib;
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const container = document.getElementById('extractedImages');
                if (container) container.innerHTML = '<p style="font-size:.85rem;color:var(--text-light);">Scanning pages for images…</p>';
                const zip = new JSZip();
                let imgCount = 0;
                const OPS = pdfjsLib.OPS;
                const ImageKind = pdfjsLib.ImageKind || { GRAYSCALE_1BPP:1, RGB_24BPP:2, RGBA_32BPP:3 };
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 1 });
                    const tmp = document.createElement('canvas'); tmp.width=Math.max(1,Math.floor(viewport.width)); tmp.height=Math.max(1,Math.floor(viewport.height));
                    await page.render({ canvasContext: tmp.getContext('2d'), viewport }).promise;
                    const opList = await page.getOperatorList();
                    for (let j = 0; j < opList.fnArray.length; j++) {
                        const fn = opList.fnArray[j];
                        if (fn !== OPS.paintImageXObject && fn !== OPS.paintJpegXObject) continue;
                        const name = opList.argsArray[j][0];
                        let imgObj;
                        try { imgObj = await new Promise((resolve, reject) => { try { page.objs.get(name, resolve); } catch (e) { reject(e); } }); } catch (e) { continue; }
                        if (!imgObj || !imgObj.data || !imgObj.width || !imgObj.height) continue;
                        const w = imgObj.width, h = imgObj.height;
                        const outCanvas = document.createElement('canvas'); outCanvas.width=w; outCanvas.height=h;
                        const outCtx = outCanvas.getContext('2d');
                        const outImageData = outCtx.createImageData(w, h);
                        const src = imgObj.data, dst = outImageData.data;
                        if (imgObj.kind === ImageKind.RGBA_32BPP) { dst.set(src); }
                        else if (imgObj.kind === ImageKind.RGB_24BPP) { for (let p=0,s=0; p<dst.length; p+=4,s+=3) { dst[p]=src[s]; dst[p+1]=src[s+1]; dst[p+2]=src[s+2]; dst[p+3]=255; } }
                        else if (imgObj.kind === ImageKind.GRAYSCALE_1BPP) {
                            const bytesPerRow = Math.ceil(w/8);
                            for (let row=0; row<h; row++) for (let col=0; col<w; col++) { const byte=src[row*bytesPerRow+(col>>3)]; const bit=(byte>>(7-(col&7)))&1; const val=bit?255:0; const p=(row*w+col)*4; dst[p]=dst[p+1]=dst[p+2]=val; dst[p+3]=255; }
                        } else { continue; }
                        outCtx.putImageData(outImageData, 0, 0);
                        imgCount++;
                        zip.file(`page${pageNum}_image${imgCount}.png`, outCanvas.toDataURL('image/png').split(',')[1], { base64: true });
                    }
                    showProgress(Math.round((pageNum/pdf.numPages)*100), true);
                }
                if (imgCount === 0) {
                    if (container) container.innerHTML = '<p style="font-size:.85rem;color:var(--text-light);">No extractable raster images found — this PDF may only contain vector graphics or text.</p>';
                    showToast('No images found', false); hideProgress(); return;
                }
                downloadBlob(await zip.generateAsync({ type:'blob' }), 'extracted-images.zip');
                if (container) container.innerHTML = `<p style="font-size:.85rem;">✅ Extracted ${imgCount} image(s). Downloading ZIP…</p>`;
                showToast(`Extracted ${imgCount} image(s)!`); hideProgress(); closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); hideProgress(); }
        }

        let metaPdfDoc = null;
        async function metadataEditor() {
            if (!currentFiles || !currentFiles.length) { showToast('Please select a PDF first', false); return; }
            try {
                const file = currentFiles[0];
                const arrayBuffer = await file.arrayBuffer();

                    <div class="form-group"><label>Subject</label><input type="text" id="metaSubject" value="${esc(pdfDoc.getSubject())}"></div>
                    <div class="form-group"><label>Keywords</label><input type="text" id="metaKeywords" value="${esc(pdfDoc.getKeywords())}"></div>

                document.getElementById('actionBtn').disabled = false;
                showToast('Metadata loaded. Edit and tap Save.');
            } catch (err) { showToast('Error: ' + err.message, false); }
        }
        async function saveMetadata() {
            if (!metaPdfDoc) { showToast('No PDF loaded', false); return; }

                metaPdfDoc.setTitle(document.getElementById('metaTitle').value);
                metaPdfDoc.setAuthor(document.getElementById('metaAuthor').value);
                metaPdfDoc.setSubject(document.getElementById('metaSubject').value);
                metaPdfDoc.setKeywords([document.getElementById('metaKeywords').value]);
                const bytes = await metaPdfDoc.save();
                downloadBlob(new Blob([bytes], { type:'application/pdf' }), 'metadata-updated.pdf');
                showToast('Metadata saved!'); closeModal();

        }
        window.wipeMetadata = async function() {
            if (!metaPdfDoc) { showToast('No PDF loaded', false); return; }
            try {
                metaPdfDoc.setTitle(''); metaPdfDoc.setAuthor(''); metaPdfDoc.setSubject(''); metaPdfDoc.setKeywords([]);
                const bytes = await metaPdfDoc.save();
                downloadBlob(new Blob([bytes], { type:'application/pdf' }), 'metadata-wiped.pdf');
                showToast('Metadata wiped!'); closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); }
        };
