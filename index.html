                        redactCtx.strokeStyle = '#ff0000';
                        redactCtx.lineWidth = 2;
                        redactCtx.fillRect(redactStartPoint.x, redactStartPoint.y, w, h);
                        redactCtx.strokeRect(redactStartPoint.x, redactStartPoint.y, w, h);
                    });
                    canvas.addEventListener('mouseup', (e) => {
                        if (!redactStartPoint || redactMode !== 'draw') return;
                        const rect = canvas.getBoundingClientRect();
                        const scaleX = canvas.width / rect.width;
                        const scaleY = canvas.height / rect.height;
                        const x = (e.clientX - rect.left) * scaleX;
                        const y = (e.clientY - rect.top) * scaleY;
                        const w = x - redactStartPoint.x;
                        const h = y - redactStartPoint.y;
                        if (Math.abs(w) > 5 && Math.abs(h) > 5) {
                            redactRectanglesArr.push({
                                x: Math.min(redactStartPoint.x, x),
                                y: Math.min(redactStartPoint.y, y),
                                w: Math.abs(w),
                                h: Math.abs(h)
                            });
                            redactCtx.putImageData(redactImageData, 0, 0);
                            redactRectanglesArr.forEach(r => {
                                redactCtx.fillStyle = 'rgba(0,0,0,0.9)';
                                redactCtx.fillRect(r.x, r.y, r.w, r.h);
                            });
                        }
                        redactStartPoint = null;
                    });
                    // Touch
                    canvas.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        if (redactMode !== 'draw') return;
                        const rect = canvas.getBoundingClientRect();
                        const scaleX = canvas.width / rect.width;
                        const scaleY = canvas.height / rect.height;
                        const touch = e.touches[0];
                        redactStartPoint = { x: (touch.clientX - rect.left) * scaleX, y: (touch.clientY - rect
                                .top) * scaleY };
                    }, { passive: false });
                    canvas.addEventListener('touchmove', (e) => {
                        e.preventDefault();
                        if (!redactStartPoint || redactMode !== 'draw') return;
                        const rect = canvas.getBoundingClientRect();
                        const scaleX = canvas.width / rect.width;
                        const scaleY = canvas.height / rect.height;
                        const touch = e.touches[0];
                        const x = (touch.clientX - rect.left) * scaleX;
                        const y = (touch.clientY - rect.top) * scaleY;
                        redactCtx.putImageData(redactImageData, 0, 0);
                        redactRectanglesArr.forEach(r => {
                            redactCtx.fillStyle = 'rgba(0,0,0,0.9)';
                            redactCtx.fillRect(r.x, r.y, r.w, r.h);
                        });
                        const w = x - redactStartPoint.x;
                        const h = y - redactStartPoint.y;
                        redactCtx.fillStyle = 'rgba(0,0,0,0.5)';
                        redactCtx.strokeStyle = '#ff0000';
                        redactCtx.lineWidth = 2;
                        redactCtx.fillRect(redactStartPoint.x, redactStartPoint.y, w, h);
                        redactCtx.strokeRect(redactStartPoint.x, redactStartPoint.y, w, h);
                    }, { passive: false });
                    canvas.addEventListener('touchend', (e) => {
                        if (!redactStartPoint || redactMode !== 'draw') return;
                        const rect = canvas.getBoundingClientRect();
                        const scaleX = canvas.width / rect.width;
                        const scaleY = canvas.height / rect.height;
                        const touch = e.changedTouches[0];
                        const x = (touch.clientX - rect.left) * scaleX;
                        const y = (touch.clientY - rect.top) * scaleY;
                        const w = x - redactStartPoint.x;
                        const h = y - redactStartPoint.y;
                        if (Math.abs(w) > 5 && Math.abs(h) > 5) {
                            redactRectanglesArr.push({
                                x: Math.min(redactStartPoint.x, x),
                                y: Math.min(redactStartPoint.y, y),
                                w: Math.abs(w),
                                h: Math.abs(h)

                            redactCtx.putImageData(redactImageData, 0, 0);

                                redactCtx.fillStyle = 'rgba(0,0,0,0.9)';
                                redactCtx.fillRect(r.x, r.y, r.w, r.h);
                            });
                        }
                        redactStartPoint = null;
                    }, { passive: false });
                } catch (err) { showToast('Error loading PDF: ' + err.message, false); }

                const angle = parseInt(document.getElementById('rotateAngle').value);

                let pagesToRotate = [];
                if (scope === 'all') {
                    for (let i = 0; i < totalPages; i++) pagesToRotate.push(i);
                } else {
                    const nums = pagesList.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n > 0 && n <=

                    if (pagesToRotate.length === 0) { showToast('Invalid page numbers', false); return; }
                }
                const pages = pdfDoc.getPages();
                pagesToRotate.forEach(idx => {
                    if (pages[idx]) pages[idx].setRotation(angle);

                const bytes = await pdfDoc.save();
                downloadBlob(new Blob([bytes], { type: 'application/pdf' }), 'rotated-' + file.name);

                pages.forEach((page, idx) => {

                    let x, y;
                    switch (position) {
                        case 'bottom-center':

                            x = width - 30;
                            y = 20;
                            break;
                        case 'top-center':
                            x = width / 2;
                            y = height - 20;

                        case 'top-right':
                            x = width - 30;
                            y = height - 20;
                            break;
                        default:

                        x: x,
                        y: y,
                        size: fontSize,

                            const newPdf = await PDFLib.PDFDocument.create();
                            const [page] = await newPdf.copyPages(src, [i]);
                            newPdf.addPage(page);
                            const bytes = await newPdf.save();
                            zip.file(`page_${i + 1}.pdf`, bytes);
                            showProgress(Math.round((i / totalPages) * 100));
                        }
                        const zipBlob = await zip.generateAsync({ type: 'blob' });
                        downloadBlob(zipBlob, 'split-pages.zip');
                    } else {
                        for (let i = 0; i < totalPages; i++) {
                            const newPdf = await PDFLib.PDFDocument.create();
                            const [page] = await newPdf.copyPages(src, [i]);
                            newPdf.addPage(page);
                            const bytes = await newPdf.save();
                            downloadBlob(new Blob([bytes], { type: 'application/pdf' }), `page_${i + 1}.pdf`);
                            showProgress(Math.round((i / totalPages) * 100));
                        }
                    }
                    hideProgress();
                    showToast('PDF split into ' + totalPages + ' pages!');
                    closeModal();
                }
            } catch (err) { showToast('Error: ' + err.message, false);
                hideProgress(); }
        }

        // ---- Extract Images ----
        async function extractImages() {
            if (!currentFiles || !currentFiles.length) { showToast('Please select a PDF first', false); return; }
            try {
                const file = currentFiles[0];
                const arrayBuffer = await file.arrayBuffer();
                const pdfjsLib = window.pdfjsLib;
                pdfjsLib.GlobalWorkerOptions.workerSrc =
                    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const container = document.getElementById('extractedImages');
                if (!container) return;
                container.innerHTML = '<p>Extracting images...</p>';
                const zip = new JSZip();
                let imgCount = 0;
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const ops = await page.getOperatorList();
                    for (let j = 0; j < ops.fnArray.length; j++) {
                        if (ops.fnArray[j] === 85) {
                            const imgName = ops.argsArray[j][0];
                            try {
                                const imgData = await page.getImage({ name: imgName });
                                if (imgData && imgData.data) {
                                    const blob = new Blob([imgData.data], { type: 'image/png' });
                                    zip.file(`image_${++imgCount}.png`, blob);
                                }
                            } catch (e) { /* ignore */ }
                        }
                    }
                    showProgress(Math.round((i / pdf.numPages) * 100));
                }
                if (imgCount === 0) {
                    container.innerHTML = '<p>No images found in this PDF.</p>';
                    showToast('No images found', false);
                    return;
                }
                const zipBlob = await zip.generateAsync({ type: 'blob' });
                downloadBlob(zipBlob, 'extracted-images.zip');
                container.innerHTML = `<p>✅ Extracted ${imgCount} images. Downloading ZIP...</p>`;
                showToast(`Extracted ${imgCount} images!`);
                hideProgress();
                closeModal();
            } catch (err) { showToast('Error: ' + err.message, false);
                hideProgress(); }
        }

        // ---- Metadata Editor ----
        let metaPdfDoc = null;

        async function metadataEditor() {
            if (!currentFiles || !currentFiles.length) { showToast('Please select a PDF first', false); return; }
            try {
                const file = currentFiles[0];
                const arrayBuffer = await file.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                metaPdfDoc = pdfDoc;
                const metadataForm = document.getElementById('metadataForm');
                if (!metadataForm) return;
                const title = pdfDoc.getTitle() || '';
                const author = pdfDoc.getAuthor() || '';
                const subject = pdfDoc.getSubject() || '';
                const keywords = pdfDoc.getKeywords() || '';
                metadataForm.innerHTML = `
                            <div class="form-group"><label>Title</label><input type="text" id="metaTitle" value="${title}"></div>
                            <div class="form-group"><label>Author</label><input type="text" id="metaAuthor" value="${author}"></div>
                            <div class="form-group"><label>Subject</label><input type="text" id="metaSubject" value="${subject}"></div>
                            <div class="form-group"><label>Keywords</label><input type="text" id="metaKeywords" value="${keywords}"></div>
                            <button class="btn btn-secondary" onclick="wipeMetadata()">Wipe All Metadata</button>
                        `;
                document.getElementById('actionBtn').disabled = false;
                showToast('Metadata loaded. Edit and click Save.');
            } catch (err) { showToast('Error: ' + err.message, false); }
        }

        async function saveMetadata() {
            if (!metaPdfDoc) { showToast('No PDF loaded', false); return; }
            try {
                const title = document.getElementById('metaTitle').value;
                const author = document.getElementById('metaAuthor').value;
                const subject = document.getElementById('metaSubject').value;
                const keywords = document.getElementById('metaKeywords').value;
                metaPdfDoc.setTitle(title);
                metaPdfDoc.setAuthor(author);
                metaPdfDoc.setSubject(subject);
                metaPdfDoc.setKeywords(keywords);
                const bytes = await metaPdfDoc.save();
                downloadBlob(new Blob([bytes], { type: 'application/pdf' }), 'metadata-updated.pdf');
                showToast('Metadata saved!');
                closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); }
        }

        window.wipeMetadata = async function() {
            if (!metaPdfDoc) { showToast('No PDF loaded', false); return; }
            try {
                metaPdfDoc.setTitle('');
                metaPdfDoc.setAuthor('');
                metaPdfDoc.setSubject('');
                metaPdfDoc.setKeywords('');
                const bytes = await metaPdfDoc.save();
                downloadBlob(new Blob([bytes], { type: 'application/pdf' }), 'metadata-wiped.pdf');
                showToast('Metadata wiped!');
                closeModal();
            } catch (err) { showToast('Error: ' + err.message, false); }
        };

        // ---- (Removed: batch-process, pdf-to-audio, pdf-to-markdown, pdf-to-cbz, crop-resize, merge-mixed, pdf-converter, pdf-to-word, pdf-to-excel, pdf-to-ppt) ----

        // ============================================================
        // 12. FINAL INIT
        // ============================================================
        console.log('✅ DOCTOOLS Core loaded with 16 reliable tools.');
    </script>
